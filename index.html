<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rocket Launch Simulator V1</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <canvas id="gameCanvas"></canvas>

    <!-- HUD -->
    <div id="hud">
      <div class="hud-panel left">
        <div class="stat">
          <span class="label">ارتفاع</span>
          <span id="altitude" class="value">0 m</span>
        </div>
        <div class="stat">
          <span class="label">سرعت</span>
          <span id="velocity" class="value">0 m/s</span>
        </div>
        <div class="stat">
          <span class="label">شتاب</span>
          <span id="acceleration" class="value">0 m/s²</span>
        </div>
        <div class="stat">
          <span class="label">زمان پرواز</span>
          <span id="flightTime" class="value">0.0 s</span>
        </div>
      </div>

      <div class="hud-panel right">
        <div class="stat">
          <span class="label">قدرت موتور</span>
          <span id="enginePower" class="value">100%</span>
        </div>
        <div class="stat">
          <span class="label">زاویه پرتاب</span>
          <span id="launchAngle" class="value">90°</span>
        </div>
        <div class="stat">
          <span class="label">وضعیت</span>
          <span id="rocketStatus" class="value">آماده</span>
        </div>
        <div class="stat">
          <span class="label">کیفیت</span>
          <span id="qualityLevel" class="value">High</span>
        </div>
      </div>
    </div>

    <!-- Control Panel -->
    <div id="controlPanel">
      <div class="panel-header">
        <h2>کنترل پرتاب</h2>
      </div>

      <div class="control-group">
        <label for="rocketType">نوع راکت</label>
        <select id="rocketType">
          <option value="basic">راکت پایه</option>
          <option value="heavy">راکت سنگین</option>
          <option value="lightweight">راکت سبک</option>
        </select>
      </div>

      <div class="control-group">
        <label for="angleSlider">زاویه پرتاب: <span id="angleValue">90°</span></label>
        <input type="range" id="angleSlider" min="30" max="90" value="90" step="1">
      </div>

      <div class="control-group">
        <label for="powerSlider">قدرت موتور: <span id="powerValue">100%</span></label>
        <input type="range" id="powerSlider" min="20" max="100" value="100" step="5">
      </div>

      <div class="control-group">
        <label for="qualitySelect">کیفیت گرافیک</label>
        <select id="qualitySelect">
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high" selected>High</option>
          <option value="ultra">Ultra</option>
        </select>
      </div>

      <div class="button-row">
        <button id="launchBtn" class="btn primary">پرتاب</button>
        <button id="pauseBtn" class="btn" disabled>توقف</button>
        <button id="resumeBtn" class="btn" disabled>ادامه</button>
        <button id="restartBtn" class="btn secondary">راه‌اندازی مجدد</button>
      </div>
    </div>

    <!-- Mobile toggle for controls -->
    <button id="toggleControls" class="mobile-only">☰ کنترل‌ها</button>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
